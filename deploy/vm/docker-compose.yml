# QuantRank500 demo VM stack (Oracle A1 / any Docker host).
# No published ports at all — cloudflared dials OUT to Cloudflare; the tunnel
# is the only way in. Postgres is reachable only inside this network.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: quantrank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: quantrank500_demo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dumps:/dumps:ro

  api:
    build: ./app
    restart: unless-stopped
    environment:
      QR500_ENV: demo
      QR500_PG_DSN: postgresql://quantrank:${POSTGRES_PASSWORD}@db:5432/quantrank500_demo
      QR500_LAKE_DSN: postgresql://quantrank:${POSTGRES_PASSWORD}@db:5432/quantrank500_demo
      QR500_ROOT_PATH: /api
      QR500_API_HOST: 0.0.0.0
      # posting-time reference lookups for tickers the lake has never seen
      DATABENTO_API_KEY: ${DATABENTO_API_KEY:-}
    depends_on:
      - db

  worker:
    build: ./app
    restart: unless-stopped
    command: ["python", "scripts/run_worker.py"]
    environment:
      QR500_ENV: demo
      QR500_PG_DSN: postgresql://quantrank:${POSTGRES_PASSWORD}@db:5432/quantrank500_demo
      QR500_LAKE_DSN: postgresql://quantrank:${POSTGRES_PASSWORD}@db:5432/quantrank500_demo
      # live ingest (M5.7): leave DATABENTO_API_KEY empty to run replay-only
      QR500_INGEST: ${QR500_INGEST:-off}
      DATABENTO_API_KEY: ${DATABENTO_API_KEY:-}
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api

  # public visitor analytics (spec v13.34): self-hosted, cookieless, and the
  # dashboard itself is public — "even our traffic is auditable"
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://quantrank:${POSTGRES_PASSWORD}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:?set in .env}
    depends_on:
      - db

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${TUNNEL_TOKEN:?set in .env}"]
    depends_on:
      - nginx

volumes:
  pgdata:
